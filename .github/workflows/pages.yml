name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run content:map:check
      - name: Verify fixture and production isolation
        run: |
          npm run content:fixture
          npm run test -- --run tests/content/search.test.ts
          npm run build
      - name: Check deployment artifact boundary
        run: |
          test -f dist/_generated/catalog.json
          test -f dist/_generated/taxonomy.json
          test -f dist/_generated/routes.json
          test -f dist/_generated/qa-index.json
          test -f dist/_generated/content-manifest.json
          test -f dist/_generated/search-status.json
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/icons/icon-192.png
          test -f dist/icons/icon-512.png
          test -f dist/icons/apple-touch-icon-180.png
          if rg -F 'self.__WB_MANIFEST' dist/sw.js; then
            echo 'Service Worker precache manifest was not injected.'
            exit 1
          fi
          if find dist -type f \( -name '*.md' -o -path '*/tests/*' -o -path '*/schemas/*' \) | grep -q .; then
            echo 'Source content or test files leaked into dist.'
            exit 1
          fi
          if rg -l 'APP_FIXTURE_ONLY|READER_PREVIEW_ONLY|Plan-[0-9]+' dist; then
            echo 'Development-only content leaked into dist.'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
