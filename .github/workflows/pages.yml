name: Validate and deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run verify
      - run: npm run content:map:check
      - name: Verify fixture and production isolation
        run: |
          npm run content:fixture
          npm run test -- --run tests/content/search.test.ts tests/pwa tests/backup
          npm run build
      - name: Check deployment artifact boundary
        run: |
          required_files=(
            dist/_generated/catalog.json
            dist/_generated/taxonomy.json
            dist/_generated/routes.json
            dist/_generated/qa-index.json
            dist/_generated/content-manifest.json
            dist/manifest.webmanifest
            dist/sw.js
            dist/icons/icon-192.png
            dist/icons/icon-512.png
            dist/icons/apple-touch-icon-180.png
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required deployment artifact: $file"
              find dist/_generated -maxdepth 3 -type f -print 2>/dev/null || true
              exit 1
            fi
          done
          if [ ! -f dist/_generated/search-status.json ] && ! find dist/_generated/pagefind -type f -print -quit 2>/dev/null | grep -q .; then
            echo 'Missing both empty-corpus search status and Pagefind index.'
            exit 1
          fi
          if grep -Fq 'self.__WB_MANIFEST' dist/sw.js; then
            echo 'Service Worker precache manifest was not injected.'
            exit 1
          fi
          if find dist -path '*/tests/fixtures/*' -o -name '*fixture*' | grep -q .; then
            echo 'Fixture data leaked into production dist.'
            exit 1
          fi
          if find dist -type f \( -name '*.md' -o -path '*/tests/*' -o -path '*/schemas/*' \) | grep -q .; then
            echo 'Source content or test files leaked into dist.'
            exit 1
          fi
          if grep -RIlE 'APP_FIXTURE_ONLY|READER_PREVIEW_ONLY|Plan-[0-9]+' dist >/dev/null; then
            echo 'Development-only content leaked into dist.'
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
